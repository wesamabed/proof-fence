name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      # The exact toolchain, not the go.mod language-version floor, is what
      # produced these results.
      - run: go run ./cmd/proof-fence toolchain
      - run: gofmt -l internal cmd | tee /dev/stderr | (! read)
      - run: go vet ./...
      - run: go test ./...
      - run: go run ./cmd/proof-fence selftest
      - run: go run ./cmd/proof-fence mutation
